dependencies {
	api project(':opt4j-core')

	/*
	 * Deep Java Library (DJL) with the PyTorch engine. Only the small Java API
	 * jars are shipped. The large native PyTorch libraries are NOT a dependency:
	 * DJL downloads the matching variant (CPU or CUDA) on first use of the
	 * gatekeeper into ~/.djl.ai (override with DJL_CACHE_DIR, select a variant
	 * with PYTORCH_FLAVOR, e.g. "cpu" or "cu118").
	 */
	implementation platform(group: 'ai.djl', name: 'bom', version: project.djlVersion)
	implementation group: 'ai.djl', name: 'api'
	implementation group: 'ai.djl.pytorch', name: 'pytorch-engine'

	testImplementation platform(group: 'org.junit', name: 'junit-bom', version: project.junitVersion)
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter'
	testImplementation group: 'org.junit.platform', name: 'junit-platform-launcher'
	testImplementation group: 'org.mockito', name: 'mockito-junit-jupiter', version: project.mockitoVersion
	testRuntimeOnly group: 'org.slf4j', name: 'slf4j-simple', version: project.slf4jVersion
}
